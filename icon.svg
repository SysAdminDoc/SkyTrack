<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SkyTrack">
    <defs>
        <linearGradient id="bg" x1="52" y1="40" x2="442" y2="478" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#111827" />
