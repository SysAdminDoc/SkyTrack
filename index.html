<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SkyTrack - Live Flight Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg: #1a1a2e;
            --bg-panel: rgba(26, 26, 46, 0.95);
            --border: rgba(255, 255, 255, 0.1);
            --text: #eee;
            --text-dim: #aaa;
            --text-muted: #666;
            --accent: #ffd700;
            --selected: #00ffff;
        }

        body.day-mode {
            --bg: #e8e8e8;
            --bg-panel: rgba(255, 255, 255, 0.92);
            --border: rgba(0, 0, 0, 0.15);
            --text: #222;
            --text-dim: #555;
            --text-muted: #888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        #map { position: absolute; inset: 0; z-index: 1; }

        .leaflet-control-attribution { display: none !important; }
        .leaflet-top.leaflet-left { top: auto !important; bottom: 30px !important; left: auto !important; right: 10px !important; }
        .leaflet-control-zoom { margin-bottom: 0 !important; }
        .leaflet-control-zoom a {
            background: var(--bg-panel) !important;
            color: var(--text) !important;
            border: 1px solid var(--border) !important;
        }
        .leaflet-control-zoom a:hover { background: rgba(128,128,128,0.3) !important; }

        .aircraft-marker { transition: none; }
        .aircraft-marker.selected { z-index: 10000 !important; }
        .aircraft-marker svg { filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.5)); }
        .aircraft-marker.selected svg { filter: drop-shadow(0 0 6px var(--selected)) drop-shadow(0 0 12px var(--selected)); }
        .aircraft-label {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 10px;
            font-weight: 600;
            padding: 1px 3px;
            border-radius: 2px;
            background: rgba(0,0,0,0.6);
            pointer-events: none;
        }
        body.day-mode .aircraft-label { background: rgba(255,255,255,0.85); color: #000; }

        .header {
            position: absolute;
            top: 10px;
            right: 10px;
            height: auto;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 6px 8px;
            gap: 4px;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 16px;
            color: var(--accent);
        }
        .logo svg { width: 22px; height: 22px; fill: var(--accent); }

        .filter-divider {
            width: 1px;
            height: 24px;
            background: var(--border);
            margin: 0 4px;
        }

        .search-box { display: none; }

        .stats { display: none; }

        .status-badge { display: none; }

        .btn-group { display: flex; gap: 4px; }

        .header-btn {
            width: 36px;
            height: 36px;
            background: rgba(128,128,128,0.15);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-btn:hover { background: rgba(128,128,128,0.25); color: var(--text); }
        .header-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
        .header-btn svg { width: 18px; height: 18px; }

        .filter-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            gap: 8px;
            z-index: 1000;
        }

        .filter-btn {
            padding: 6px 12px;
            background: rgba(128,128,128,0.15);
            border: 1px solid var(--border);
            border-radius: 16px;
            color: var(--text-dim);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .filter-btn:hover { background: rgba(128,128,128,0.25); color: var(--text); }
        .filter-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
        .filter-btn .count { margin-left: 4px; opacity: 0.7; }

        .info-panel {
            position: absolute;
            top: 60px;
            left: 10px;
            width: 300px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            z-index: 1000;
            display: none;
            max-height: calc(100vh - 80px);
            overflow-y: auto;
        }
        .info-panel.show { display: block; }

        .aircraft-photo {
            width: 100%;
            height: 160px;
            background: #111;
            border-radius: 8px 8px 0 0;
            overflow: hidden;
            position: relative;
        }
        .aircraft-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .aircraft-photo .no-photo {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 12px;
        }

        .airline-banner {
            width: 100%;
            height: 45px;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--border);
        }
        .airline-banner img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .info-header {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .info-callsign { font-size: 20px; font-weight: 700; color: var(--selected); }
        .info-hex { font-size: 11px; color: var(--text-muted); font-family: monospace; }
        .info-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
        }
        .info-close:hover { color: var(--text); }

        .info-section {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
        }
        .info-section:last-child { border-bottom: none; }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 12px;
        }
        .info-label { color: var(--text-muted); }
        .info-value { font-weight: 500; text-align: right; }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .info-stat {
            background: rgba(128,128,128,0.1);
            padding: 8px;
            border-radius: 6px;
            text-align: center;
        }
        .info-stat-value { font-size: 15px; font-weight: 700; }
        .info-stat-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; margin-top: 2px; }

        .squawk-code { font-family: monospace; font-weight: 700; padding: 2px 6px; border-radius: 3px; }
        .squawk-normal { background: rgba(128,128,128,0.2); }
        .squawk-7500, .squawk-7600, .squawk-7700 { background: #ef4444; color: #fff; }

        .trail-status {
            padding: 6px 10px;
            background: rgba(128,128,128,0.1);
            border-radius: 4px;
            font-size: 11px;
            color: var(--text-dim);
            text-align: center;
            margin-top: 6px;
        }

        .settings-panel {
            position: absolute;
            top: 60px;
            right: 10px;
            width: 260px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            z-index: 1001;
            display: none;
        }
        .settings-panel.show { display: block; }
        .settings-title {
            font-weight: 600;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }
        .setting-label { font-size: 13px; }
        
        .toggle {
            width: 44px;
            height: 24px;
            background: rgba(128,128,128,0.3);
            border-radius: 12px;
            position: relative;
            cursor: pointer;
        }
        .toggle::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: transform 0.2s;
        }
        .toggle.on { background: var(--accent); }
        .toggle.on::after { transform: translateX(20px); }

        .legend {
            position: absolute;
            bottom: 30px;
            left: 10px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            z-index: 900;
            font-size: 10px;
        }
        .legend-title { font-weight: 600; margin-bottom: 6px; color: var(--text-dim); }
        .legend-items { display: flex; flex-direction: column; gap: 3px; }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-color { width: 18px; height: 10px; border-radius: 2px; }

        .loading-overlay {
            position: absolute;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            gap: 24px;
        }
        .loading-overlay.hidden { display: none; }
        .loading-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 28px;
            color: var(--accent);
        }
        .loading-logo svg {
            width: 36px;
            height: 36px;
            fill: var(--accent);
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 8px;
            z-index: 3000;
            opacity: 0;
            transition: all 0.3s;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        .data-source {
            font-size: 10px;
            color: var(--text-muted);
            text-align: center;
            padding: 4px;
            background: rgba(128,128,128,0.1);
            border-radius: 0 0 8px 8px;
        }

        @media (max-width: 768px) {
            .info-panel, .settings-panel { width: calc(100% - 20px); }
            .legend { display: none; }
            .filter-bar { flex-wrap: wrap; right: 10px; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loading">
        <div class="loading-logo">
            <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
            <span>SkyTrack</span>
        </div>
        <div class="spinner"></div>
    </div>

    <div id="map"></div>

    <header class="header">
        <button class="header-btn" id="dayNightBtn" title="Toggle Satellite View">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
        <button class="header-btn active" id="labelBtn" title="Toggle Labels">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
        </button>
        <button class="header-btn" id="radarBtn" title="Toggle Radar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        </button>
        <button class="header-btn" id="locateBtn" title="My Location">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg>
        </button>
        <button class="header-btn" id="settingsBtn" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </button>
    </header>

    <div class="filter-bar" id="filterBar">
        <div class="logo">
            <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
            <span>SkyTrack</span>
        </div>
        <div class="filter-divider"></div>
        <button class="filter-btn active" data-filter="all">All <span class="count" id="countAll">0</span></button>
        <button class="filter-btn" data-filter="commercial">Commercial <span class="count" id="countComm">0</span></button>
        <button class="filter-btn" data-filter="military">Military <span class="count" id="countMil">0</span></button>
        <button class="filter-btn" data-filter="cargo">Cargo <span class="count" id="countCargo">0</span></button>
        <button class="filter-btn" data-filter="cessna">Cessna <span class="count" id="countCessna">0</span></button>
        <button class="filter-btn" data-filter="private">Private <span class="count" id="countPrivate">0</span></button>
        <button class="filter-btn" data-filter="helicopter">Heli <span class="count" id="countHeli">0</span></button>
        <button class="filter-btn" data-filter="ground">Ground <span class="count" id="countGnd">0</span></button>
    </div>

    <div class="info-panel" id="infoPanel">
        <div class="aircraft-photo" id="aircraftPhoto">
            <div class="no-photo">Loading photo...</div>
        </div>
        <div class="airline-banner" id="airlineBanner" style="display:none;">
            <img src="" alt="Airline">
        </div>
        <div class="info-header">
            <div>
                <div class="info-callsign" id="infoCallsign">---</div>
                <div class="info-hex" id="infoHex">---</div>
            </div>
            <button class="info-close" id="infoClose">&times;</button>
        </div>
        
        <div class="info-section">
            <div class="info-grid">
                <div class="info-stat">
                    <div class="info-stat-value" id="infoAlt">---</div>
                    <div class="info-stat-label">Altitude</div>
                </div>
                <div class="info-stat">
                    <div class="info-stat-value" id="infoSpeed">---</div>
                    <div class="info-stat-label">Speed</div>
                </div>
                <div class="info-stat">
                    <div class="info-stat-value" id="infoTrack">---</div>
                    <div class="info-stat-label">Track</div>
                </div>
                <div class="info-stat">
                    <div class="info-stat-value" id="infoVRate">---</div>
                    <div class="info-stat-label">V/S</div>
                </div>
            </div>
        </div>

        <div class="info-section">
            <div class="info-row">
                <span class="info-label">Registration</span>
                <span class="info-value" id="infoReg">---</span>
            </div>
            <div class="info-row">
                <span class="info-label">Type</span>
                <span class="info-value" id="infoType">---</span>
            </div>
            <div class="info-row">
                <span class="info-label">Category</span>
                <span class="info-value" id="infoCat">---</span>
            </div>
            <div class="info-row">
                <span class="info-label">Squawk</span>
                <span class="info-value"><span class="squawk-code squawk-normal" id="infoSquawk">----</span></span>
            </div>
            <div class="trail-status" id="trailStatus">Loading trail...</div>
        </div>
        <div class="data-source" id="dataSource">Connecting...</div>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <div class="settings-title">Settings</div>
        <div class="setting-row">
            <span class="setting-label">Show Labels</span>
            <div class="toggle on" id="toggleLabels"></div>
        </div>
        <div class="setting-row">
            <span class="setting-label">Satellite View</span>
            <div class="toggle" id="toggleDayMode"></div>
        </div>
        <div class="setting-row">
            <span class="setting-label">Weather Radar</span>
            <div class="toggle" id="toggleRadar"></div>
        </div>
    </div>

    <div class="legend">
        <div class="legend-title">Altitude</div>
        <div class="legend-items">
            <div class="legend-item"><div class="legend-color" style="background:#ff0000"></div>&gt; 40k ft</div>
            <div class="legend-item"><div class="legend-color" style="background:#ff8000"></div>30-40k</div>
            <div class="legend-item"><div class="legend-color" style="background:#f8f800"></div>20-30k</div>
            <div class="legend-item"><div class="legend-color" style="background:#00c000"></div>10-20k</div>
            <div class="legend-item"><div class="legend-color" style="background:#00c0c0"></div>5-10k</div>
            <div class="legend-item"><div class="legend-color" style="background:#0080ff"></div>&lt;5k</div>
            <div class="legend-item"><div class="legend-color" style="background:#808080"></div>Ground</div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
    // ============================================================
    // SKYTRACK v8 - Real-time Flight Tracker
    // 
    // DATA SOURCE PRIORITY WITH CORS PROXY FALLBACKS:
    // ------------------------------------------------
    // 1. OpenSky Network (native CORS support - tried first!)
    // 2. ADSB.lol via CORS proxies
    // 3. Airplanes.live via CORS proxies
    //
    // CORS PROXIES (cycled automatically on failure):
    // - corsproxy.io
    // - allorigins.win  
    // ============================================================

    const CONFIG = {
        center: [39.8, -98.5],
        zoom: 5,
        refreshInterval: 6000,
        
        // CORS Proxies for API calls
        corsProxies: [
            url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
            url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
            url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
        ],
        
        // Silhouette images (img tag, no CORS issues)
        silhouetteUrl: 'https://globe.airplanes.live/aircraft_sil/',
        
        // Trail source
        traceUrl: 'https://globe.airplanes.live/data/traces/',
        
        // Airline banners (img tag, no CORS issues)
        airlineBannerUrl: 'https://globe.airplanes.live/airline_banners/'
    };

    // State
    let map;
    let darkTileLayer, satelliteTileLayer;
    let aircraftCache = {};
    let markers = {};
    let trailLine = null;
    let selectedHex = null;
    let radarLayer = null;
    let lastFetchTime = 0;
    let fetchInProgress = false;
    let currentProxyIndex = 0;
    let lastSuccessfulMethod = null;

    const settings = {
        showLabels: true,
        dayMode: false,
        showRadar: false,
        filter: 'all'
    };

    // Aircraft classification
    const MILITARY_HEX_PREFIXES = ['AE', 'AF'];
    // Note: Be careful with C17, C130, C5 - must not match Cessna types like C172, C130 is ok
    const MILITARY_TYPES = ['F16', 'F15', 'F18', 'F22', 'F35', 'C17A', 'C17B', 'C130', 'C5', 'C5A', 'C5B', 'C5M', 'KC135', 'KC10', 'KC46', 'E3', 'E6', 'E8', 'B52', 'B1', 'B2', 'A10', 'P8', 'P3', 'EP3', 'RC135', 'U2', 'RQ4', 'MQ9', 'V22', 'H60', 'UH60', 'MH60', 'HH60', 'CH47', 'AH64', 'C130J', 'C130H', 'C17'];
    const CARGO_CALLSIGNS = ['FDX', 'UPS', 'GTI', 'ABX', 'ATN', 'CLX', 'BOX', 'MPH'];
    const CARGO_TYPES = ['B74F', 'B77F', 'B76F', 'A30F', 'A33F', 'MD11', 'B763'];
    const HELI_TYPES = ['EC35', 'EC45', 'EC55', 'EC30', 'A109', 'A139', 'A169', 'B06', 'B05', 'B07', 'B47', 'AS50', 'AS55', 'AS65', 'S76', 'S92', 'S70', 'S61', 'R22', 'R44', 'R66', 'MD52', 'MD60', 'H160', 'H175', 'H145', 'H135', 'H125', 'H225', 'H215', 'BK17', 'B412', 'B429', 'B407'];
    
    // Cessna aircraft types (all models)
    const CESSNA_TYPES = [
        'C150', 'C152', 'C162', 'C170', 'C172', 'C175', 'C177', 'C180', 'C182', 'C185', 'C188', 'C190', 'C195',

    // ============ UTILITIES ============
    function getAltitudeColor(alt) {
        if (alt === 'ground' || alt === null || alt === undefined || alt <= 0) return '#808080';
        if (alt < 1000) return '#0040ff';
        if (alt < 5000) return '#0080ff';
        if (alt < 10000) return '#00c0c0';
        if (alt < 20000) return '#00c000';
        if (alt < 30000) return '#c0c000';
        if (alt < 40000) return '#ff8000';
        return '#ff0000';
    }

    function classifyAircraft(ac) {
        const hex = (ac.hex || '').toUpperCase();
        const type = (ac.t || '').toUpperCase();
        const callsign = (ac.flight || '').toUpperCase().trim();
        const alt = ac.alt_baro;
        const cat = ac.category || '';

        if (alt === 'ground' || alt === 0 || (ac.gs !== undefined && ac.gs < 30 && (!alt || alt < 500))) return 'ground';
        
        // Check Cessna FIRST (before military to avoid C17/C172 confusion)
        if (CESSNA_TYPES.some(t => type === t || type.startsWith(t))) return 'cessna';
        
        // Check other private types
        if (PRIVATE_TYPES.some(t => type === t || type.startsWith(t))) return 'private';
        
        // Military checks - use exact match to avoid false positives
        if (MILITARY_HEX_PREFIXES.some(p => hex.startsWith(p))) return 'military';
        if (MILITARY_TYPES.some(t => type === t)) return 'military';
        if (ac.dbFlags && (ac.dbFlags & 1)) return 'military';
        
        if (cat === 'A7') return 'helicopter';
        if (HELI_TYPES.some(t => type.startsWith(t) || type === t)) return 'helicopter';
        if (CARGO_CALLSIGNS.some(c => callsign.startsWith(c))) return 'cargo';
        if (CARGO_TYPES.some(t => type.includes(t))) return 'cargo';
        if (type.endsWith('F') && type.length === 4) return 'cargo';
        
        // Category A1 = Light, A2 = Small - typically private
        if (cat === 'A1' || cat === 'A2') return 'private';
        
        return 'commercial';
    }

    function getAirlineCode(callsign) {
        if (!callsign || callsign.length < 3) return null;
        const code = callsign.substring(0, 3).toUpperCase();
        if (/^[A-Z]{3}$/.test(code)) return code;
        return null;
    }

    // ============ OPENSKY NETWORK (HAS CORS SUPPORT!) ============
    async function fetchOpenSky(bounds) {
        const url = `https://opensky-network.org/api/states/all?lamin=${bounds.getSouth().toFixed(4)}&lomin=${bounds.getWest().toFixed(4)}&lamax=${bounds.getNorth().toFixed(4)}&lomax=${bounds.getEast().toFixed(4)}`;
        
        console.log('Trying OpenSky (direct CORS)...');
        
        const resp = await fetch(url, { signal: AbortSignal.timeout(12000) });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        
        const data = await resp.json();
        if (!data || !data.states || data.states.length === 0) {
            throw new Error('No aircraft data');
        }
        
        // Transform OpenSky format to our format
        return data.states
            .filter(s => s[5] !== null && s[6] !== null)
            .map(s => ({
                hex: (s[0] || '').toUpperCase().trim(),
                flight: (s[1] || '').trim(),
                lat: s[6],
                lon: s[5],
                alt_baro: s[7] ? Math.round(s[7] * 3.28084) : null, // meters to feet
                gs: s[9] ? Math.round(s[9] * 1.94384) : null, // m/s to knots
                track: s[10],
                baro_rate: s[11] ? Math.round(s[11] * 196.85) : null, // m/s to fpm
                squawk: s[14] || '',
                on_ground: s[8],
                t: '',
                r: '',
                category: ''
            }));
    }

    // ============ ADSB API VIA CORS PROXY ============
    async function fetchAdsbViaProxy(center, radius, apiName, baseUrl) {
        const apiUrl = `${baseUrl}/point/${center.lat.toFixed(4)}/${center.lng.toFixed(4)}/${radius}`;
        
        for (let i = 0; i < CONFIG.corsProxies.length; i++) {
            const proxyIndex = (currentProxyIndex + i) % CONFIG.corsProxies.length;
            const proxyFn = CONFIG.corsProxies[proxyIndex];
            const proxiedUrl = proxyFn(apiUrl);
            
            console.log(`Trying ${apiName} via proxy ${proxyIndex}...`);
            
            try {
                const resp = await fetch(proxiedUrl, { signal: AbortSignal.timeout(10000) });
                
                if (!resp.ok) {
                    console.log(`Proxy ${proxyIndex} returned ${resp.status}`);
                    continue;
                }
                
                const data = await resp.json();
                
                if (data && data.ac && data.ac.length > 0) {
                    currentProxyIndex = proxyIndex; // Remember working proxy
                    return { aircraft: data.ac, proxyIndex };
                }
            } catch (e) {
                console.log(`Proxy ${proxyIndex} failed: ${e.message}`);
            }
        }
        
        throw new Error(`All proxies failed for ${apiName}`);
    }

    // ============ MAIN DATA LOADING WITH FULL FAILOVER ============
    async function loadAircraft() {
        const now = Date.now();
        if (now - lastFetchTime < 3000) return;
        if (fetchInProgress) return;

        fetchInProgress = true;
        lastFetchTime = now;

        const bounds = map.getBounds();
        const center = map.getCenter();
        const latDiff = bounds.getNorth() - bounds.getSouth();
        const radius = Math.min(250, Math.max(25, Math.round(latDiff * 60 / 2)));

        let aircraft = null;
        let sourceName = null;

        // METHOD 1: OpenSky Network (has native CORS support!)
        if (!aircraft) {
            try {
                aircraft = await fetchOpenSky(bounds);
                sourceName = 'OpenSky';
                lastSuccessfulMethod = 'opensky';
                console.log(`OpenSky success: ${aircraft.length} aircraft`);
            } catch (e) {
                console.log('OpenSky failed:', e.message);
            }
        }

        // METHOD 2: ADSB.lol via CORS proxy
        if (!aircraft) {
            try {
                const result = await fetchAdsbViaProxy(center, radius, 'ADSB.lol', 'https://api.adsb.lol/v2');
                aircraft = result.aircraft;
                sourceName = `ADSB.lol (proxy)`;
                lastSuccessfulMethod = 'adsblol';
                console.log(`ADSB.lol success: ${aircraft.length} aircraft`);
            } catch (e) {
                console.log('ADSB.lol failed:', e.message);
            }
        }

        // METHOD 3: Airplanes.live via CORS proxy
        if (!aircraft) {
            try {
                const result = await fetchAdsbViaProxy(center, radius, 'Airplanes.live', 'https://api.airplanes.live/v2');
                aircraft = result.aircraft;
                sourceName = `Airplanes.live (proxy)`;
                lastSuccessfulMethod = 'airplaneslive';
                console.log(`Airplanes.live success: ${aircraft.length} aircraft`);
            } catch (e) {
                console.log('Airplanes.live failed:', e.message);
            }
        }

        // Process results
        if (aircraft && aircraft.length > 0) {
            processAircraftData(aircraft);
            document.getElementById('loading').classList.add('hidden');
        } else {
            console.error('All data sources failed');
        }

        fetchInProgress = false;
    }

    function processAircraftData(aircraft) {
        const now = Date.now();

        aircraft.forEach(ac => {
            if (!ac.hex) return;
            
            const hex = ac.hex.toUpperCase();
            const existing = aircraftCache[hex] || {};

            // Build local position history
            let history = existing.history || [];
            if (ac.lat !== undefined && ac.lon !== undefined) {
                const lastPos = history[history.length - 1];
                if (!lastPos || lastPos[0] !== ac.lat || lastPos[1] !== ac.lon) {
                    history.push([ac.lat, ac.lon, ac.alt_baro]);
                    if (history.length > 300) history.shift();
                }
            }

            aircraftCache[hex] = {
                ...existing,
                hex: hex,
                flight: ac.flight?.trim() || existing.flight || '',
                r: ac.r || existing.r || '',
                t: ac.t || existing.t || '',
                lat: ac.lat ?? existing.lat,
                lon: ac.lon ?? existing.lon,
                alt_baro: ac.alt_baro ?? existing.alt_baro,
                gs: ac.gs ?? existing.gs,
                track: ac.track ?? existing.track,
                baro_rate: ac.baro_rate ?? existing.baro_rate,
                squawk: ac.squawk || existing.squawk || '',
                category: ac.category || existing.category || '',
                dbFlags: ac.dbFlags ?? existing.dbFlags,
                lastSeen: now,
                history: history,
                category_type: null
            };

            aircraftCache[hex].category_type = classifyAircraft(aircraftCache[hex]);
        });

        // Remove stale aircraft (5 minutes)
        const staleTime = now - 300000;
        Object.keys(aircraftCache).forEach(hex => {
            if (aircraftCache[hex].lastSeen < staleTime) {
                delete aircraftCache[hex];
                if (markers[hex]) {
                    map.removeLayer(markers[hex]);
                    delete markers[hex];
                }
            }
        });

        updateCounts();
        updateMarkers();
    }

    function updateCounts() {
        const counts = { all: 0, commercial: 0, military: 0, cargo: 0, cessna: 0, private: 0, helicopter: 0, ground: 0 };
        
        Object.values(aircraftCache).forEach(ac => {
            counts.all++;
            if (counts[ac.category_type] !== undefined) counts[ac.category_type]++;
        });

        document.getElementById('countAll').textContent = counts.all;
        document.getElementById('countComm').textContent = counts.commercial;
        document.getElementById('countMil').textContent = counts.military;
        document.getElementById('countCargo').textContent = counts.cargo;
        document.getElementById('countCessna').textContent = counts.cessna;
        document.getElementById('countPrivate').textContent = counts.private;
        document.getElementById('countHeli').textContent = counts.helicopter;
        document.getElementById('countGnd').textContent = counts.ground;
    }

    // ============ MARKERS ============
    function updateMarkers() {
        const bounds = map.getBounds();

        Object.values(aircraftCache).forEach(ac => {
            if (ac.lat === undefined || ac.lon === undefined) return;

            const inView = bounds.pad(0.2).contains([ac.lat, ac.lon]);

            if (settings.filter !== 'all' && ac.category_type !== settings.filter) {
                if (markers[ac.hex]) {
                    map.removeLayer(markers[ac.hex]);
                    delete markers[ac.hex];
                }
                return;
            }

            if (!inView) {
                if (markers[ac.hex]) {
                    map.removeLayer(markers[ac.hex]);
                    delete markers[ac.hex];
                }
                return;
            }

            if (markers[ac.hex]) {
                updateMarker(ac);
            } else {
                createMarker(ac);
            }
        });
    }

    function createMarker(ac) {
        const icon = createIcon(ac);
        const marker = L.marker([ac.lat, ac.lon], { 
            icon: icon,
            zIndexOffset: getZIndex(ac)
        });

        marker.on('click', (e) => {
            L.DomEvent.stopPropagation(e);
            selectAircraft(ac.hex);
        });

        marker.addTo(map);
        markers[ac.hex] = marker;
    }

    function updateMarker(ac) {
        const marker = markers[ac.hex];
        if (!marker) return;

        marker.setLatLng([ac.lat, ac.lon]);
        marker.setIcon(createIcon(ac));
        marker.setZIndexOffset(getZIndex(ac));
    }

    function createIcon(ac) {
        const color = getAltitudeColor(ac.alt_baro);
        const rotation = ac.track || 0;
        const isSelected = ac.hex === selectedHex;
        const size = isSelected ? 30 : 22;

        let labelHtml = '';
        if (settings.showLabels && (ac.flight || ac.hex)) {
            const labelText = ac.flight || ac.hex;
            labelHtml = `<div class="aircraft-label" style="color:${isSelected ? '#00ffff' : color}">${labelText}</div>`;
        }

        const strokeColor = settings.dayMode ? '#fff' : '#000';
        const svg = `<svg viewBox="0 0 36 36" width="${size}" height="${size}" style="transform:rotate(${rotation}deg)">
            <path fill="${color}" stroke="${strokeColor}" stroke-width="0.5" d="M18 3 L20 14 L32 18 L20 20 L20 30 L24 33 L24 34 L18 32 L12 34 L12 33 L16 30 L16 20 L4 18 L16 14 Z"/>
        </svg>`;

        return L.divIcon({
            className: `aircraft-marker ${isSelected ? 'selected' : ''}`,
            html: svg + labelHtml,
            iconSize: [size, size],
            iconAnchor: [size/2, size/2]
        });
    }

    function getZIndex(ac) {
        const alt = ac.alt_baro === 'ground' ? 0 : (ac.alt_baro || 0);
        return ac.hex === selectedHex ? 50000 : alt;
    }

    // ============ TRAIL LOADING (FULL FLIGHT FROM ORIGIN) ============
    async function loadTrail(hex) {
        const trailStatus = document.getElementById('trailStatus');
        trailStatus.textContent = 'Loading full trail...';
        
        if (trailLine) {
            // Clean up origin marker if it exists
            if (trailLine._originMarker) {
                map.removeLayer(trailLine._originMarker);
            }
            map.removeLayer(trailLine);
            trailLine = null;
        }

        const ac = aircraftCache[hex];
        if (!ac) return;

        const hexSuffix = hex.slice(-2).toLowerCase();
        const hexLower = hex.toLowerCase();
        
        // Try trace endpoints in order: full (complete flight) -> recent -> local
        const traceEndpoints = [
            { url: `${CONFIG.traceUrl}${hexSuffix}/trace_full_${hexLower}.json`, name: 'full' },
            { url: `${CONFIG.traceUrl}${hexSuffix}/trace_recent_${hexLower}.json`, name: 'recent' }
        ];

        for (const endpoint of traceEndpoints) {
            trailStatus.textContent = `Loading ${endpoint.name} trail...`;
            
            // Try each proxy for this endpoint
            for (let i = 0; i < CONFIG.corsProxies.length; i++) {
                const proxyFn = CONFIG.corsProxies[(currentProxyIndex + i) % CONFIG.corsProxies.length];
                const proxiedUrl = proxyFn(endpoint.url);
                
                try {
                    const resp = await fetch(proxiedUrl, { signal: AbortSignal.timeout(15000) });
                    if (!resp.ok) continue;
                    
                    const data = await resp.json();
                    
                    if (data && data.trace && data.trace.length > 1) {
                        // Filter to current flight only (from most recent takeoff)
                        const currentFlightTrace = filterToCurrentFlight(data.trace);
                        
                        const points = currentFlightTrace
                            .filter(p => p[1] !== null && p[2] !== null)
                            .map(p => [p[1], p[2]]);
                        
                        // Add current aircraft position to close the gap
                        if (ac.lat !== undefined && ac.lon !== undefined) {
                            const lastPoint = points[points.length - 1];
                            // Only add if it's different from the last trace point
                            if (!lastPoint || lastPoint[0] !== ac.lat || lastPoint[1] !== ac.lon) {
                                points.push([ac.lat, ac.lon]);
                            }
                        }
                        
                        if (points.length > 1) {
                            const color = getAltitudeColor(ac.alt_baro);
                            
                            // Draw the trail
                            trailLine = L.polyline(points, {
                                color: color,
                                weight: 3,
                                opacity: 0.85
                            }).addTo(map);
                            
                            // Add origin marker (takeoff point)
                            const originPoint = points[0];
                            const originMarker = L.circleMarker(originPoint, {
                                radius: 6,
                                color: '#fff',
                                fillColor: '#00ff00',
                                fillOpacity: 1,
                                weight: 2
                            }).addTo(map);
                            originMarker.bindTooltip('Takeoff', { permanent: false, direction: 'top' });
                            
                            // Store origin marker for cleanup
                            trailLine._originMarker = originMarker;
                            
                            trailStatus.textContent = `Trail: ${points.length} pts (${endpoint.name})`;
                            console.log(`Loaded ${endpoint.name} trail with ${points.length} points (filtered from ${data.trace.length})`);
                            return;
                        }
                    }
                } catch (e) {
                    console.log(`Trail proxy failed: ${e.message}`);
                    continue;
                }
            }
        }

        // Fallback: Local history
        if (ac.history && ac.history.length > 1) {
            const points = ac.history.map(p => [p[0], p[1]]);
            
            // Add current position to close the gap
            if (ac.lat !== undefined && ac.lon !== undefined) {
                const lastPoint = points[points.length - 1];
                if (!lastPoint || lastPoint[0] !== ac.lat || lastPoint[1] !== ac.lon) {
                    points.push([ac.lat, ac.lon]);
                }
            }
            
            const color = getAltitudeColor(ac.alt_baro);
            
            trailLine = L.polyline(points, {
                color: color,
                weight: 3,
                opacity: 0.85
            }).addTo(map);
            
            trailStatus.textContent = `Trail: ${points.length} pts (local)`;
        } else {
            trailStatus.textContent = 'Trail: Building...';
        }
    }

    // Filter trace data to only include the current flight (from most recent takeoff)
    function filterToCurrentFlight(trace) {
        if (!trace || trace.length < 2) return trace;
        
        // Trace format: [seconds_offset, lat, lon, altitude, ground_speed, track, flags, vert_rate, ...]
        // Find the last point where aircraft was on ground (takeoff point)
        // Work backwards to find the start of the current flight
        
        let takeoffIndex = 0;
        
        for (let i = trace.length - 1; i >= 0; i--) {
            const point = trace[i];
            const altitude = point[3]; // altitude in feet (can be "ground" string or number)
            const groundSpeed = point[4]; // ground speed in knots
            
            // Detect ground/takeoff conditions:
            // - altitude is "ground" or very low (< 500 ft)
            // - AND ground speed is low (< 50 knots) indicating taxiing/stopped
            const isOnGround = (
                altitude === 'ground' || 
                altitude === null ||
                (typeof altitude === 'number' && altitude < 500 && groundSpeed < 50)
            );
            
            if (isOnGround) {
                // Found a ground point - this could be takeoff
                // Look for where the aircraft started climbing after this
                for (let j = i; j < trace.length; j++) {
                    const nextPoint = trace[j];
                    const nextAlt = nextPoint[3];
                    const nextSpeed = nextPoint[4];
                    
                    // Find first point where aircraft is clearly airborne
                    if (typeof nextAlt === 'number' && nextAlt > 500 && nextSpeed > 80) {
                        // Start the trail a few points before liftoff to show takeoff roll
                        takeoffIndex = Math.max(0, i - 2);
                        break;
                    }
                }
                break;
            }
            
            // Also check for large time gaps (> 30 min) which indicate separate flights
            if (i > 0) {
                const currentTime = trace[i][0];
                const prevTime = trace[i-1][0];
                if (currentTime - prevTime > 1800) { // 30 minute gap
                    takeoffIndex = i;
                    break;
                }
            }
        }
        
        // Return only the current flight portion
        return trace.slice(takeoffIndex);
    }

    // ============ PHOTO LOADING ============
    const photoCache = {};
    const photoFailCache = {}; // Cache failed lookups to avoid retrying
    
    async function loadAircraftPhoto(hex, registration, type) {
        const photoDiv = document.getElementById('aircraftPhoto');
        
        // Check positive cache first
        if (photoCache[hex]) {
            displayPhoto(photoCache[hex]);
            return;
        }
        
        // Check fail cache - don't retry if we already failed
        if (photoFailCache[hex]) {
            showFallbackPhoto(type, photoDiv);
            return;
        }

        photoDiv.innerHTML = '<div class="no-photo">Loading photo...</div>';

        // Try Planespotters.net via CORS proxies
        const planespottersUrl = `https://api.planespotters.net/pub/photos/hex/${hex}`;
        
        // Try each proxy with short timeout
        for (let i = 0; i < CONFIG.corsProxies.length; i++) {
            const proxyFn = CONFIG.corsProxies[i];
            const proxiedUrl = proxyFn(planespottersUrl);
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);
                
                const resp = await fetch(proxiedUrl, { 
                    signal: controller.signal,
                    headers: { 'Accept': 'application/json' }
                });
                
                clearTimeout(timeoutId);
                
                if (!resp.ok) {
                    console.log(`Photo proxy ${i}: HTTP ${resp.status}`);
                    continue;
                }
                
                const text = await resp.text();
                
                // Validate it's JSON
                if (!text.startsWith('{') && !text.startsWith('[')) {
                    console.log(`Photo proxy ${i}: Not JSON response`);
                    continue;
                }
                
                const data = JSON.parse(text);
                
                if (data.photos && data.photos.length > 0) {
                    const photo = data.photos[0];
                    const photoUrl = photo.thumbnail_large?.src || photo.thumbnail?.src;
                    
                    if (photoUrl) {
                        const result = {
                            url: photoUrl,
                            credit: photo.photographer,
                            source: 'Planespotters.net'
                        };
                        photoCache[hex] = result;
                        displayPhoto(result);
                        console.log(`Photo loaded for ${hex} via proxy ${i}`);
                        return;
                    }
                }
                
                // API returned successfully but no photos - this aircraft has no photos
                console.log(`No photos available for ${hex}`);
                photoFailCache[hex] = true;
                showFallbackPhoto(type, photoDiv);
                return;
                
            } catch (e) {
                if (e.name === 'AbortError') {
                    console.log(`Photo proxy ${i}: Timeout`);
                } else {
                    console.log(`Photo proxy ${i}: ${e.message}`);
                }
            }
        }

        // All proxies failed - cache the failure and show fallback
        console.log(`All photo proxies failed for ${hex}`);
        photoFailCache[hex] = true;
        showFallbackPhoto(type, photoDiv);
    }
    
    function showFallbackPhoto(type, photoDiv) {
        if (type) {
            displayPhoto({
                url: `${CONFIG.silhouetteUrl}${type.toUpperCase()}.png`,
                credit: null,
                source: 'Silhouette',
                isSilhouette: true
            });
        } else {
            photoDiv.innerHTML = `
                <div class="no-photo" style="flex-direction: column; gap: 8px;">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="#666">
                        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
                    </svg>
                    <span>No photo available</span>
                </div>
            `;
        }
    }

    function displayPhoto(photo) {
        const photoDiv = document.getElementById('aircraftPhoto');
        
        const style = photo.isSilhouette ? 
            'object-fit: contain; background: #1a1a2e; padding: 20px;' : 
            'object-fit: cover;';
        
        photoDiv.innerHTML = `
            <img src="${photo.url}" alt="Aircraft" style="${style}"
                 onerror="this.parentElement.innerHTML='<div class=\\'no-photo\\'>Photo unavailable</div>'">
        `;
    }

    // ============ AIRLINE BANNER (img tag - no CORS) ============
    function loadAirlineBanner(callsign) {
        const bannerDiv = document.getElementById('airlineBanner');
        const airlineCode = getAirlineCode(callsign);
        
        if (!airlineCode) {
            bannerDiv.style.display = 'none';
            return;
        }

        const bannerUrl = `${CONFIG.airlineBannerUrl}${airlineCode}.png`;
        const img = bannerDiv.querySelector('img');
        
        img.onload = () => { bannerDiv.style.display = 'flex'; };
        img.onerror = () => { bannerDiv.style.display = 'none'; };
        img.src = bannerUrl;
    }

    // ============ SELECTION ============
    function selectAircraft(hex) {
        if (trailLine) {
            // Clean up origin marker if it exists
            if (trailLine._originMarker) {
                map.removeLayer(trailLine._originMarker);
            }
            map.removeLayer(trailLine);
            trailLine = null;
        }

        selectedHex = hex;
        const ac = aircraftCache[hex];
        if (!ac) return;

        document.getElementById('infoCallsign').textContent = ac.flight || 'N/A';
        document.getElementById('infoHex').textContent = ac.hex;
        document.getElementById('infoReg').textContent = ac.r || 'N/A';
        document.getElementById('infoType').textContent = ac.t || 'N/A';
        
        const catMap = { commercial: 'Commercial', military: 'Military', cargo: 'Cargo', cessna: 'Cessna', private: 'Private', helicopter: 'Helicopter', ground: 'Ground' };
        document.getElementById('infoCat').textContent = catMap[ac.category_type] || 'Unknown';
        
        const alt = ac.alt_baro === 'ground' ? 'Ground' : (ac.alt_baro ? ac.alt_baro.toLocaleString() + ' ft' : '---');
        document.getElementById('infoAlt').textContent = alt;
        document.getElementById('infoSpeed').textContent = ac.gs ? Math.round(ac.gs) + ' kts' : '---';
        document.getElementById('infoTrack').textContent = ac.track ? Math.round(ac.track) + '\u00B0' : '---';
        document.getElementById('infoVRate').textContent = ac.baro_rate ? (ac.baro_rate > 0 ? '+' : '') + ac.baro_rate + ' fpm' : '---';

        const squawkEl = document.getElementById('infoSquawk');
        squawkEl.textContent = ac.squawk || '----';
        squawkEl.className = 'squawk-code squawk-' + (['7500', '7600', '7700'].includes(ac.squawk) ? ac.squawk : 'normal');

        document.getElementById('infoPanel').classList.add('show');
        document.getElementById('settingsPanel').classList.remove('show');
        
        loadAircraftPhoto(hex, ac.r, ac.t);
        loadAirlineBanner(ac.flight);
        loadTrail(hex);
        
        updateMarkers();
        map.panTo([ac.lat, ac.lon]);
    }

    function deselectAircraft() {
        if (trailLine) {
            // Clean up origin marker if it exists
            if (trailLine._originMarker) {
                map.removeLayer(trailLine._originMarker);
            }
            map.removeLayer(trailLine);
            trailLine = null;
        }
        selectedHex = null;
        document.getElementById('infoPanel').classList.remove('show');
        updateMarkers();
    }

    // ============ UI ============
    function initUI() {
        document.getElementById('infoClose').addEventListener('click', deselectAircraft);

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                settings.filter = btn.dataset.filter;
                updateMarkers();
            });
        });

        document.getElementById('dayNightBtn').addEventListener('click', toggleDayMode);
        document.getElementById('labelBtn').addEventListener('click', function() {
            settings.showLabels = !settings.showLabels;
            this.classList.toggle('active', settings.showLabels);
            document.getElementById('toggleLabels').classList.toggle('on', settings.showLabels);
            updateMarkers();
        });
        document.getElementById('radarBtn').addEventListener('click', toggleRadar);
        document.getElementById('locateBtn').addEventListener('click', geolocate);
        document.getElementById('settingsBtn').addEventListener('click', () => {
            document.getElementById('settingsPanel').classList.toggle('show');
            document.getElementById('infoPanel').classList.remove('show');
        });

        document.getElementById('toggleLabels').addEventListener('click', function() {
            settings.showLabels = !settings.showLabels;
            this.classList.toggle('on', settings.showLabels);
            document.getElementById('labelBtn').classList.toggle('active', settings.showLabels);
            updateMarkers();
        });
        document.getElementById('toggleDayMode').addEventListener('click', toggleDayMode);
        document.getElementById('toggleRadar').addEventListener('click', toggleRadar);
    }

    function toggleDayMode() {
        settings.dayMode = !settings.dayMode;
        document.body.classList.toggle('day-mode', settings.dayMode);
        document.getElementById('toggleDayMode').classList.toggle('on', settings.dayMode);

        if (settings.dayMode) {
            map.removeLayer(darkTileLayer);
            satelliteTileLayer.addTo(map);
        } else {
            map.removeLayer(satelliteTileLayer);
            darkTileLayer.addTo(map);
        }

        updateMarkers();
    }

    async function toggleRadar() {
        settings.showRadar = !settings.showRadar;
        document.getElementById('radarBtn').classList.toggle('active', settings.showRadar);
        document.getElementById('toggleRadar').classList.toggle('on', settings.showRadar);

        if (settings.showRadar) {
            try {
                const resp = await fetch('https://api.rainviewer.com/public/weather-maps.json');
                const data = await resp.json();
                
                const frame = data.radar?.past?.slice(-1)[0];
                if (!frame) return;

                if (radarLayer) map.removeLayer(radarLayer);

                radarLayer = L.tileLayer(`${data.host}${frame.path}/256/{z}/{x}/{y}/4/1_1.png`, {
                    opacity: 0.4,
                    maxNativeZoom: 12
                }).addTo(map);
                radarLayer.setZIndex(50);
                toast('Radar loaded');
            } catch (err) {
                toast('Radar unavailable');
            }
        } else if (radarLayer) {
            map.removeLayer(radarLayer);
            radarLayer = null;
        }
    }

    function geolocate() {
        navigator.geolocation?.getCurrentPosition(
            pos => {
                map.setView([pos.coords.latitude, pos.coords.longitude], 9);
                toast('Location updated');
            },
            () => toast('Location denied')
        );
    }

    function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 3000);
    }
    </script>
</body>
</html>
