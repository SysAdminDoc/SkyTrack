<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SkyTrack - Live Flight Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg: #1a1a2e;
            --bg-panel: rgba(26, 26, 46, 0.95);
            --border: rgba(255, 255, 255, 0.1);
            --text: #eee;
            --text-dim: #aaa;
            --text-muted: #666;
            --accent: #ffd700;
            --selected: #00ffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        #map { 
            position: absolute; 
            inset: 0; 
            z-index: 1; 
            background: #1a1a2e;
        }

        /* Aircraft marker styles */
        .aircraft-marker {
            transition: transform 0.1s linear;
        }
        .aircraft-marker.selected {
            z-index: 10000 !important;
        }
        .aircraft-marker svg {
            filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.5));
        }
        .aircraft-marker.selected svg {
            filter: drop-shadow(0 0 6px var(--selected)) drop-shadow(0 0 12px var(--selected));
        }
        .aircraft-label {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 10px;
            font-weight: 600;
            padding: 1px 3px;
            border-radius: 2px;
            background: rgba(0,0,0,0.6);
            pointer-events: none;
        }

        /* Header */
        .header {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            height: 50px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 16px;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
            color: var(--accent);
        }
        .logo svg {
            width: 28px;
            height: 28px;
            fill: var(--accent);
        }

        .search-box {
            flex: 1;
            max-width: 300px;
            padding: 8px 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 13px;
            outline: none;
        }
        .search-box:focus {
            border-color: var(--accent);
        }
        .search-box::placeholder {
            color: var(--text-muted);
        }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 13px;
        }
        .stat-value {
            font-weight: 700;
            color: var(--accent);
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-badge.connected {
            background: #22c55e;
            color: #000;
        }
        .status-badge.loading {
            background: #f59e0b;
            color: #000;
        }
        .status-badge.error {
            background: #ef4444;
            color: #fff;
        }

        .header-btn {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-btn:hover {
            background: rgba(255,255,255,0.1);
            color: var(--text);
        }
        .header-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }
        .header-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Info Panel */
        .info-panel {
            position: absolute;
            top: 70px;
            left: 10px;
            width: 320px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            z-index: 1000;
            display: none;
            max-height: calc(100vh - 90px);
            overflow-y: auto;
        }
        .info-panel.show {
            display: block;
        }

        .info-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .info-callsign {
            font-size: 24px;
            font-weight: 700;
            color: var(--selected);
        }
        .info-hex {
            font-size: 12px;
            color: var(--text-muted);
            font-family: monospace;
        }
        .info-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
        }
        .info-close:hover {
            color: var(--text);
        }

        .info-section {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }
        .info-section:last-child {
            border-bottom: none;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 13px;
        }
        .info-label {
            color: var(--text-muted);
        }
        .info-value {
            font-weight: 500;
            text-align: right;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .info-stat {
            background: rgba(255,255,255,0.03);
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }
        .info-stat-value {
            font-size: 20px;
            font-weight: 700;
        }
        .info-stat-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 4px;
        }

        .squawk-code {
            font-family: monospace;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .squawk-normal { background: rgba(255,255,255,0.1); }
        .squawk-7500 { background: #ef4444; color: #fff; }
        .squawk-7600 { background: #f59e0b; color: #000; }
        .squawk-7700 { background: #ef4444; color: #fff; }

        /* Altitude Legend */
        .legend {
            position: absolute;
            bottom: 30px;
            left: 10px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            z-index: 900;
            font-size: 11px;
        }
        .legend-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-dim);
        }
        .legend-items {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-color {
            width: 20px;
            height: 12px;
            border-radius: 2px;
        }

        /* Map controls override */
        .leaflet-control-zoom {
            border: none !important;
        }
        .leaflet-control-zoom a {
            background: var(--bg-panel) !important;
            color: var(--text) !important;
            border: 1px solid var(--border) !important;
        }
        .leaflet-control-zoom a:hover {
            background: rgba(255,255,255,0.1) !important;
        }
        .leaflet-control-attribution {
            background: rgba(26, 26, 46, 0.8) !important;
            color: var(--text-muted) !important;
        }
        .leaflet-control-attribution a {
            color: var(--text-dim) !important;
        }

        /* Loading */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .loading-overlay.hidden {
            display: none;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            margin-top: 16px;
            color: var(--text-dim);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 8px;
            z-index: 3000;
            opacity: 0;
            transition: all 0.3s;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .stats { display: none; }
            .info-panel {
                left: 10px;
                right: 10px;
                width: auto;
            }
            .legend { display: none; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Connecting to airplanes.live...</div>
    </div>

    <div id="map"></div>

    <header class="header">
        <div class="logo">
            <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
            <span>SkyTrack</span>
        </div>

        <input type="text" class="search-box" id="searchInput" placeholder="Search callsign, hex, or type...">

        <div class="stats">
            <span>Aircraft: <span class="stat-value" id="aircraftCount">0</span></span>
            <span>With Pos: <span class="stat-value" id="posCount">0</span></span>
        </div>

        <div class="status-badge loading" id="statusBadge">Connecting</div>

        <button class="header-btn" id="radarBtn" title="Toggle Weather Radar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        </button>
        <button class="header-btn" id="labelBtn" title="Toggle Labels">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
        </button>
        <button class="header-btn" id="locateBtn" title="My Location">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg>
        </button>
    </header>

    <div class="info-panel" id="infoPanel">
        <div class="info-header">
            <div>
                <div class="info-callsign" id="infoCallsign">---</div>
                <div class="info-hex" id="infoHex">---</div>
            </div>
            <button class="info-close" id="infoClose">&times;</button>
        </div>
        
        <div class="info-section">
            <div class="info-grid">
                <div class="info-stat">
                    <div class="info-stat-value" id="infoAlt">---</div>
                    <div class="info-stat-label">Altitude (ft)</div>
                </div>
                <div class="info-stat">
                    <div class="info-stat-value" id="infoSpeed">---</div>
                    <div class="info-stat-label">Speed (kts)</div>
                </div>
                <div class="info-stat">
                    <div class="info-stat-value" id="infoTrack">---</div>
                    <div class="info-stat-label">Track (&deg;)</div>
                </div>
                <div class="info-stat">
                    <div class="info-stat-value" id="infoVRate">---</div>
                    <div class="info-stat-label">Vert Rate</div>
                </div>
            </div>
        </div>

        <div class="info-section">
            <div class="info-row">
                <span class="info-label">Registration</span>
                <span class="info-value" id="infoReg">---</span>
            </div>
            <div class="info-row">
                <span class="info-label">Type</span>
                <span class="info-value" id="infoType">---</span>
            </div>
            <div class="info-row">
                <span class="info-label">Squawk</span>
                <span class="info-value"><span class="squawk-code squawk-normal" id="infoSquawk">----</span></span>
            </div>
            <div class="info-row">
                <span class="info-label">Position</span>
                <span class="info-value" id="infoPos">---</span>
            </div>
            <div class="info-row">
                <span class="info-label">Distance</span>
                <span class="info-value" id="infoDist">---</span>
            </div>
        </div>
    </div>

    <div class="legend">
        <div class="legend-title">Altitude</div>
        <div class="legend-items">
            <div class="legend-item"><div class="legend-color" style="background:#ff0000"></div>&gt;40,000 ft</div>
            <div class="legend-item"><div class="legend-color" style="background:#ff8000"></div>30-40,000 ft</div>
            <div class="legend-item"><div class="legend-color" style="background:#f8f800"></div>20-30,000 ft</div>
            <div class="legend-item"><div class="legend-color" style="background:#00c000"></div>10-20,000 ft</div>
            <div class="legend-item"><div class="legend-color" style="background:#00c0c0"></div>5-10,000 ft</div>
            <div class="legend-item"><div class="legend-color" style="background:#0080ff"></div>1-5,000 ft</div>
            <div class="legend-item"><div class="legend-color" style="background:#808080"></div>Ground</div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
    // ============================================================
    // SKYTRACK - Real-time Flight Tracker
    // Data from airplanes.live API
    // ============================================================

    const CONFIG = {
        center: [39.8, -98.5],
        zoom: 5,
        refreshInterval: 5000,
        apiUrl: 'https://api.airplanes.live/v2',
        proxyUrls: [
            'https://api.allorigins.win/raw?url=',
            'https://corsproxy.io/?'
        ]
    };

    // State
    let map;
    let aircraftData = {};
    let markers = {};
    let selectedHex = null;
    let showLabels = true;
    let radarLayer = null;
    let userLocation = null;
    let useProxy = false;
    let currentProxyIndex = 0;

    // Aircraft SVG icon path (tar1090 style)
    const AIRCRAFT_SVG = `<svg viewBox="0 0 36 36" width="SIZE" height="SIZE" style="transform:rotate(ROTATIONdeg)">
        <path fill="COLOR" stroke="#000" stroke-width="0.5" d="M18 3 L20 14 L32 18 L20 20 L20 30 L24 33 L24 34 L18 32 L12 34 L12 33 L16 30 L16 20 L4 18 L16 14 Z"/>
    </svg>`;

    // Altitude to color mapping (tar1090 style)
    function getAltitudeColor(alt) {
        if (alt === 'ground' || alt === null || alt === undefined || alt <= 0) return '#808080';
        if (alt < 1000) return '#0040ff';
        if (alt < 5000) return '#0080ff';
        if (alt < 10000) return '#00c0c0';
        if (alt < 20000) return '#00c000';
        if (alt < 30000) return '#c0c000';
        if (alt < 40000) return '#ff8000';
        return '#ff0000';
    }

    // ============ INITIALIZATION ============
    document.addEventListener('DOMContentLoaded', init);

    async function init() {
        initMap();
        initUI();
        await loadAircraft();
        
        // Start refresh loop
        setInterval(loadAircraft, CONFIG.refreshInterval);
    }

    function initMap() {
        map = L.map('map', {
            center: CONFIG.center,
            zoom: CONFIG.zoom,
            zoomControl: true,
            preferCanvas: true
        });

        // Dark map style
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OSM &copy; CARTO | Data: airplanes.live',
            maxZoom: 18
        }).addTo(map);

        // Events
        map.on('moveend', loadAircraft);
        map.on('click', () => deselectAircraft());
    }

    // ============ API LOADING ============
    async function loadAircraft() {
        const bounds = map.getBounds();
        const center = map.getCenter();
        
        // Calculate radius based on viewport (in nm)
        const latDiff = bounds.getNorth() - bounds.getSouth();
        const radius = Math.min(250, Math.max(25, Math.round(latDiff * 60 / 2)));

        updateStatus('loading', 'Loading...');

        try {
            let data;
            
            // Try direct API first
            if (!useProxy) {
                try {
                    const resp = await fetch(`${CONFIG.apiUrl}/point/${center.lat}/${center.lng}/${radius}`, {
                        signal: AbortSignal.timeout(8000)
                    });
                    if (resp.ok) {
                        data = await resp.json();
                    }
                } catch (e) {
                    console.log('Direct API failed, trying proxy...');
                    useProxy = true;
                }
            }

            // Try proxy if direct failed
            if (!data && useProxy) {
                data = await fetchWithProxy(`${CONFIG.apiUrl}/point/${center.lat}/${center.lng}/${radius}`);
            }

            if (data && data.ac) {
                processAircraftData(data.ac);
                updateStatus('connected', 'Live');
                document.getElementById('loading').classList.add('hidden');
            } else {
                throw new Error('No data received');
            }

        } catch (err) {
            console.error('Failed to load aircraft:', err);
            updateStatus('error', 'Error');
            
            // Try next proxy on failure
            if (useProxy) {
                currentProxyIndex = (currentProxyIndex + 1) % CONFIG.proxyUrls.length;
            }
        }
    }

    async function fetchWithProxy(url) {
        const proxyUrl = CONFIG.proxyUrls[currentProxyIndex];
        const fullUrl = proxyUrl + encodeURIComponent(url);
        
        const resp = await fetch(fullUrl, {
            signal: AbortSignal.timeout(10000)
        });
        
        if (!resp.ok) throw new Error('Proxy request failed');
        return await resp.json();
    }

    function processAircraftData(aircraft) {
        const newData = {};
        let withPos = 0;

        aircraft.forEach(ac => {
            if (!ac.hex) return;
            
            const hex = ac.hex.toUpperCase();
            
            // Merge with existing data for smoother updates
            const existing = aircraftData[hex] || {};
            
            newData[hex] = {
                hex: hex,
                flight: ac.flight?.trim() || existing.flight || '',
                r: ac.r || existing.r || '',
                t: ac.t || existing.t || '',
                lat: ac.lat ?? existing.lat,
                lon: ac.lon ?? existing.lon,
                alt_baro: ac.alt_baro ?? existing.alt_baro,
                alt_geom: ac.alt_geom ?? existing.alt_geom,
                gs: ac.gs ?? existing.gs,
                track: ac.track ?? existing.track,
                baro_rate: ac.baro_rate ?? existing.baro_rate,
                squawk: ac.squawk || existing.squawk || '',
                category: ac.category || existing.category || '',
                nav_modes: ac.nav_modes || existing.nav_modes,
                seen: ac.seen ?? 0,
                seen_pos: ac.seen_pos ?? existing.seen_pos ?? 999,
                rssi: ac.rssi ?? existing.rssi
            };

            if (newData[hex].lat !== undefined && newData[hex].lon !== undefined) {
                withPos++;
            }
        });

        aircraftData = newData;
        
        // Update stats
        document.getElementById('aircraftCount').textContent = Object.keys(aircraftData).length;
        document.getElementById('posCount').textContent = withPos;

        // Update markers
        updateMarkers();
    }

    // ============ MARKERS ============
    function updateMarkers() {
        const validHexes = new Set();

        Object.values(aircraftData).forEach(ac => {
            if (ac.lat === undefined || ac.lon === undefined) return;
            if (ac.seen_pos > 60) return; // Skip stale positions
            
            validHexes.add(ac.hex);

            if (markers[ac.hex]) {
                // Update existing marker
                updateMarker(ac);
            } else {
                // Create new marker
                createMarker(ac);
            }
        });

        // Remove stale markers
        Object.keys(markers).forEach(hex => {
            if (!validHexes.has(hex)) {
                map.removeLayer(markers[hex]);
                delete markers[hex];
            }
        });
    }

    function createMarker(ac) {
        const icon = createIcon(ac);
        const marker = L.marker([ac.lat, ac.lon], { 
            icon: icon,
            zIndexOffset: getZIndex(ac)
        });

        marker.on('click', (e) => {
            L.DomEvent.stopPropagation(e);
            selectAircraft(ac.hex);
        });

        marker.addTo(map);
        markers[ac.hex] = marker;
    }

    function updateMarker(ac) {
        const marker = markers[ac.hex];
        if (!marker) return;

        marker.setLatLng([ac.lat, ac.lon]);
        marker.setIcon(createIcon(ac));
        marker.setZIndexOffset(getZIndex(ac));
    }

    function createIcon(ac) {
        const alt = ac.alt_baro === 'ground' ? 0 : (ac.alt_baro || 0);
        const color = getAltitudeColor(ac.alt_baro);
        const rotation = ac.track || 0;
        const isSelected = ac.hex === selectedHex;
        const size = isSelected ? 32 : 24;

        let labelHtml = '';
        if (showLabels && (ac.flight || ac.hex)) {
            const labelText = ac.flight || ac.hex;
            const labelColor = isSelected ? '#00ffff' : color;
            labelHtml = `<div class="aircraft-label" style="color:${labelColor}">${labelText}</div>`;
        }

        const svg = AIRCRAFT_SVG
            .replace('SIZE', size)
            .replace('SIZE', size)
            .replace('ROTATION', rotation)
            .replace('COLOR', color);

        return L.divIcon({
            className: `aircraft-marker ${isSelected ? 'selected' : ''}`,
            html: svg + labelHtml,
            iconSize: [size, size],
            iconAnchor: [size/2, size/2]
        });
    }

    function getZIndex(ac) {
        const alt = ac.alt_baro === 'ground' ? 0 : (ac.alt_baro || 0);
        return ac.hex === selectedHex ? 50000 : alt;
    }

    // ============ SELECTION ============
    function selectAircraft(hex) {
        selectedHex = hex;
        const ac = aircraftData[hex];
        if (!ac) return;

        // Update info panel
        document.getElementById('infoCallsign').textContent = ac.flight || 'N/A';
        document.getElementById('infoHex').textContent = ac.hex;
        document.getElementById('infoReg').textContent = ac.r || 'N/A';
        document.getElementById('infoType').textContent = ac.t || 'N/A';
        
        const alt = ac.alt_baro === 'ground' ? 'Ground' : 
                    (ac.alt_baro ? ac.alt_baro.toLocaleString() : '---');
        document.getElementById('infoAlt').textContent = alt;
        document.getElementById('infoSpeed').textContent = ac.gs ? Math.round(ac.gs) : '---';
        document.getElementById('infoTrack').textContent = ac.track ? Math.round(ac.track) : '---';
        document.getElementById('infoVRate').textContent = ac.baro_rate ? 
            (ac.baro_rate > 0 ? '+' : '') + ac.baro_rate : '---';

        const squawkEl = document.getElementById('infoSquawk');
        squawkEl.textContent = ac.squawk || '----';
        squawkEl.className = 'squawk-code squawk-' + (
            ac.squawk === '7500' || ac.squawk === '7600' || ac.squawk === '7700' 
                ? ac.squawk : 'normal'
        );

        document.getElementById('infoPos').textContent = 
            ac.lat !== undefined ? `${ac.lat.toFixed(4)}, ${ac.lon.toFixed(4)}` : '---';

        // Calculate distance from user if available
        if (userLocation && ac.lat !== undefined) {
            const dist = getDistance(userLocation.lat, userLocation.lng, ac.lat, ac.lon);
            document.getElementById('infoDist').textContent = dist.toFixed(1) + ' nm';
        } else {
            document.getElementById('infoDist').textContent = '---';
        }

        document.getElementById('infoPanel').classList.add('show');
        
        // Update markers to show selection
        updateMarkers();
        
        // Center map on aircraft
        map.panTo([ac.lat, ac.lon]);
    }

    function deselectAircraft() {
        selectedHex = null;
        document.getElementById('infoPanel').classList.remove('show');
        updateMarkers();
    }

    // ============ UI ============
    function initUI() {
        document.getElementById('infoClose').addEventListener('click', deselectAircraft);

        document.getElementById('labelBtn').addEventListener('click', function() {
            showLabels = !showLabels;
            this.classList.toggle('active', showLabels);
            updateMarkers();
        });
        document.getElementById('labelBtn').classList.add('active');

        document.getElementById('radarBtn').addEventListener('click', async function() {
            const isActive = this.classList.toggle('active');
            if (isActive) {
                await loadRadar();
            } else if (radarLayer) {
                map.removeLayer(radarLayer);
                radarLayer = null;
            }
        });

        document.getElementById('locateBtn').addEventListener('click', () => {
            navigator.geolocation?.getCurrentPosition(
                pos => {
                    userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    map.setView([userLocation.lat, userLocation.lng], 9);
                    loadAircraft();
                    toast('Location updated');
                },
                () => toast('Location access denied')
            );
        });

        // Search
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            const query = this.value.toUpperCase().trim();
            
            searchTimeout = setTimeout(() => {
                if (!query) return;

                // Search through aircraft
                const match = Object.values(aircraftData).find(ac => 
                    ac.hex.includes(query) ||
                    (ac.flight && ac.flight.toUpperCase().includes(query)) ||
                    (ac.r && ac.r.toUpperCase().includes(query)) ||
                    (ac.t && ac.t.toUpperCase().includes(query))
                );

                if (match && match.lat !== undefined) {
                    selectAircraft(match.hex);
                }
            }, 300);
        });
    }

    async function loadRadar() {
        try {
            const resp = await fetch('https://api.rainviewer.com/public/weather-maps.json');
            const data = await resp.json();
            
            const frame = data.radar?.past?.slice(-1)[0];
            if (!frame) return;

            if (radarLayer) map.removeLayer(radarLayer);

            radarLayer = L.tileLayer(`${data.host}${frame.path}/256/{z}/{x}/{y}/4/1_1.png`, {
                opacity: 0.4,
                maxNativeZoom: 12
            }).addTo(map);

            radarLayer.setZIndex(50);
            toast('Radar loaded');
        } catch (err) {
            console.error('Radar failed:', err);
            toast('Radar unavailable');
        }
    }

    function updateStatus(type, text) {
        const badge = document.getElementById('statusBadge');
        badge.className = 'status-badge ' + type;
        badge.textContent = text;
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 3440.065; // Earth radius in nm
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 3000);
    }
    </script>
</body>
